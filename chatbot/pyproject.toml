# ============================================
# SoundFlow AI Chatbot — Project Configuration
# ============================================

[project]
name = "soundflow-chatbot"
version = "1.0.0"
description = "AI Agent Chatbot for SoundFlow music streaming platform"
requires-python = ">=3.11"

# ============================================
# Ruff (Linter + Formatter)
# ============================================
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "tools", "memory", "rag", "config"]

[tool.ruff.format]
quote-style = "double"

# ============================================
# Pytest
# ============================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

# ============================================
# Coverage
# ============================================
[tool.coverage.run]
source = ["agent", "tools", "memory", "rag"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
