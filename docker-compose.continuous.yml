# ================================================================
# SoundFlow - Continuous Streaming Override
# ================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.continuous.yml up -d
#
# This override enables continuous event generation for:
#   - Long-running streaming tests
#   - Production-like simulation
#   - Load testing
# ================================================================

services:
  eventsim:
    command: >
      --config /opt/eventsim/examples/example-config.json
      --nusers ${EVENTSIM_NUSERS:-100}
      --from ${EVENTSIM_FROM_DAYS:-7}
      --to ${EVENTSIM_TO_DAYS:-1}
      --continuous
    restart: always
