version: '3.8'

# Override file for continuous streaming mode
# Usage: docker-compose -f docker-compose.yml -f docker-compose.continuous.yml up

services:
  eventsim:
    command: >
      --config /opt/eventsim/examples/example-config.json
      --nusers ${EVENTSIM_NUSERS:-100}
      --from ${EVENTSIM_FROM_DAYS:-7}
      --to ${EVENTSIM_TO_DAYS:-1}
      --continuous
