soundflow:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    # Local PostgreSQL (for development and testing)
    local:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', 5432) | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'soundflow') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'soundflow123') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'soundflow') }}"
      schema: staging
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      search_path: "raw,staging,marts,public"
    
    # Production BigQuery (for cloud deployment)
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: staging  # Default dataset for models
      location: "{{ env_var('BQ_LOCATION', 'asia-southeast1') }}"
      threads: 8
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      timeout_seconds: 600
      priority: interactive
      maximum_bytes_billed: 10000000000  # 10GB limit for safety
      
    # Development BigQuery (for testing on GCP)
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: staging_dev
      location: "{{ env_var('BQ_LOCATION', 'asia-southeast1') }}"
      threads: 4
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      timeout_seconds: 300
      priority: interactive
      maximum_bytes_billed: 5000000000  # 5GB limit for dev
