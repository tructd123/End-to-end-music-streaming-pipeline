services:
  metabase:
    image: metabase/metabase:latest
    container_name: soundflow-metabase
    ports:
      - "3030:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase123
      MB_DB_HOST: metabase-db
      # BigQuery settings will be configured via UI
      JAVA_TIMEZONE: Asia/Ho_Chi_Minh
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - metabase-db
    networks:
      - metabase-network
    restart: unless-stopped

  metabase-db:
    image: postgres:15-alpine
    container_name: metabase-postgres
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase123
      POSTGRES_DB: metabase
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - metabase-network
    restart: unless-stopped

volumes:
  metabase-data:
  postgres-data:

networks:
  metabase-network:
    driver: bridge
