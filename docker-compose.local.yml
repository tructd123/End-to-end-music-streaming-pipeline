# ================================================================
# SoundFlow - Local Development Override
# ================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# This override file:
#   - Adds PostgreSQL database for local storage
#   - Adds Adminer for database management
#   - Modifies Spark to use local Postgres instead of GCS
#   - Modifies Dagster to use local Postgres
#   - Enables continuous EventSim streaming
# ================================================================

services:
  # ============================================
  # DATABASE - PostgreSQL (Local Storage)
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: soundflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soundflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soundflow123}
      POSTGRES_DB: ${POSTGRES_DB:-soundflow}
    ports:
      - "5432:5432"      # PostgreSQL
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Admin UI
  adminer:
    image: adminer:4.8.1
    container_name: soundflow-adminer
    depends_on:
      - postgres
    ports:
      - "8083:8080"      # Adminer UI (8083 to avoid conflicts)
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - streaming-network

  # ============================================
  # OVERRIDE - EventSim (Enable continuous mode)
  # ============================================
  eventsim:
    command: >
      --config /opt/eventsim/examples/example-config.json
      --nusers ${EVENTSIM_NUSERS:-100}
      --from ${EVENTSIM_FROM_DAYS:-7}
      --to ${EVENTSIM_TO_DAYS:-1}
      --continuous

  # ============================================
  # OVERRIDE - Spark (Use local Postgres)
  # ============================================
  spark-streaming:
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-soundflow}
      - POSTGRES_USER=${POSTGRES_USER:-soundflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-soundflow123}
      - PYTHONIOENCODING=utf-8
      # Override GCP settings for local mode
      - GCS_BUCKET=
      - GCP_PROJECT=
    volumes:
      - ./spark_streaming/src:/app/src
      - ./spark_streaming/checkpoints:/app/checkpoints

  # ============================================
  # OVERRIDE - Dagster (Use local Postgres)
  # ============================================
  dagster-webserver:
    depends_on:
      - dagster-daemon
      - postgres
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-soundflow}
      - POSTGRES_USER=${POSTGRES_USER:-soundflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-soundflow123}
      - DBT_TARGET=local
      - PYTHONIOENCODING=utf-8
      # Override GCP settings for local mode
      - GCS_BUCKET=
      - GCP_PROJECT=
      - BQ_DATASET=

  dagster-daemon:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-soundflow}
      - POSTGRES_USER=${POSTGRES_USER:-soundflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-soundflow123}
      - DBT_TARGET=local
      - PYTHONIOENCODING=utf-8
      # Override GCP settings for local mode
      - GCS_BUCKET=
      - GCP_PROJECT=
      - BQ_DATASET=

# ============================================
# ADDITIONAL VOLUMES FOR LOCAL MODE
# ============================================
volumes:
  postgres-data:
    name: soundflow-postgres-data
